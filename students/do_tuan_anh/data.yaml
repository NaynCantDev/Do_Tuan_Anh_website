            - ["Alt + ← / Alt + ↑", "Quay lại / Lên thư mục cha"]
            - ["Ctrl + A", "Chọn tất cả"]

        - type: principles
          title: "Rút ra cho việc quản lý tài liệu học tập"
          example_label: "Áp dụng"
          items:
            - title: "Đặt tên không dấu, không khoảng trắng"
              text: "Dùng chữ Latinh không dấu, nối bằng gạch dưới hoặc viết hoa đầu từ, để tên tệp không lỗi khi gửi qua email, nén hay tải lên mạng."
              example: "ThucHanh_DoTuanAnh, GhiChuQuanTrong.txt"
            - title: "Tên tệp nói được nội dung và thời điểm"
              text: "Thêm môn học, nội dung và ngày theo dạng năm-tháng-ngày để tệp tự xếp đúng thứ tự thời gian."
              example: "2026-11-14_HoaAm_BaiGiang_TSD.pdf, 2026-11-14_ThanhNhac_LuyenHoi.mp3"
            - title: "Luôn bật hiện đuôi tệp"
              text: "Bật View → Show → File name extensions để thấy đuôi .txt, .docx, .mp3. Nếu đuôi bị ẩn, rất dễ đặt nhầm thành “GhiChu.txt.txt”."
              example: "Ở bài này cột Type hiện TXT File và tên hiện đủ đuôi .txt."
            - title: "Cấu trúc thư mục theo môn học"
              text: "Mỗi môn một thư mục, bên trong chia thành TaiLieu, BaiTap, SanPham giống như cách bài thực hành tạo thư mục con TaiLieu."
              example: "HocTap › NhapMonCNS › TaiLieu | BaiTap | Portfolio; HocTap › ThanhNhac › BaiHat | BanThu"
            - title: "Cân nhắc trước khi Shift + Delete"
              text: "Xóa vĩnh viễn là thao tác không có đường lui. Với tài liệu học tập, nên xóa thường để còn Thùng rác làm “lưới an toàn”, và sao lưu bài quan trọng lên Google Drive hoặc OneDrive."
              example: "Bản thu âm luyện hát, bài giảng đã soạn nên có ít nhất một bản sao trên đám mây."
      gallery: []

