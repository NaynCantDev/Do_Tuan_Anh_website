  learning_goal: |
    Môn học Nhập môn Công nghệ số và Ứng dụng AI nhằm trang bị cho sinh viên những kiến thức cơ bản về công nghệ số, chuyển đổi số và trí tuệ nhân tạo (AI), giúp sinh viên hiểu được vai trò, tầm quan trọng cũng như những ứng dụng của công nghệ trong học tập, công việc và đời sống. Bên cạnh đó, môn học giúp sinh viên biết cách sử dụng các công cụ AI như ChatGPT, Gemini, Copilot để tìm kiếm thông tin, hỗ trợ học tập, giải quyết vấn đề và nâng cao hiệu quả công việc. Sinh viên cũng được rèn luyện kỹ năng đặt câu lệnh (Prompt), phân tích, đánh giá và kiểm chứng thông tin do AI cung cấp.

    Ngoài ra, môn học còn giúp hình thành tư duy sáng tạo, khả năng thích ứng với sự phát triển của công nghệ, đồng thời nâng cao ý thức về bảo mật thông tin, quyền riêng tư, bản quyền và trách nhiệm khi sử dụng AI. Qua đó, sinh viên có thể vận dụng hiệu quả công nghệ số và trí tuệ nhân tạo vào thực tiễn, đáp ứng yêu cầu học tập và làm việc trong thời đại số.

