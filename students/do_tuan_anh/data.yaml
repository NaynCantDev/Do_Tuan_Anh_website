  learning_goal: |
    Môn học Nhập môn Công nghệ số và Ứng dụng AI nhằm trang bị cho sinh viên những kiến thức cơ bản về công nghệ số, chuyển đổi số và trí tuệ nhân tạo (AI), giúp sinh viên hiểu được vai trò, tầm quan trọng cũng như những ứng dụng của công nghệ trong học tập, công việc và đời sống. Bên cạnh đó, môn học giúp sinh viên biết cách sử dụng các công cụ AI như ChatGPT, Gemini, Copilot để tìm kiếm thông tin, hỗ trợ học tập, giải quyết vấn đề và nâng cao hiệu quả công việc. Sinh viên cũng được rèn luyện kỹ năng đặt câu lệnh (Prompt), phân tích, đánh giá và kiểm chứng thông tin do AI cung cấp.

    Ngoài ra, môn học còn giúp hình thành tư duy sáng tạo, khả năng thích ứng với sự phát triển của công nghệ, đồng thời nâng cao ý thức về bảo mật thông tin, quyền riêng tư, bản quyền và trách nhiệm khi sử dụng AI. Qua đó, sinh viên có thể vận dụng hiệu quả công nghệ số và trí tuệ nhân tạo vào thực tiễn, đáp ứng yêu cầu học tập và làm việc trong thời đại số.

  # Định hướng phát triển cá nhân – mỗi dòng là một "track" trong bản phối
  direction_intro: "Chủ động, sáng tạo và thích ứng với xu thế chuyển đổi số trong giáo dục — từng bước nâng cao năng lực ứng dụng công nghệ số và AI vào học tập, nghiên cứu khoa học và nghiệp vụ sư phạm âm nhạc."
  direction_tracks:
    - name: "Sáng tạo"
      text: "Chủ động khai thác công cụ AI để hỗ trợ sáng tạo âm nhạc."
      clips: [[0, 3], [4, 8]]
    - name: "Lớp học"
      text: "Thiết kế bài giảng, xây dựng học liệu số và đổi mới phương pháp dạy học."
      clips: [[2, 6], [7, 12]]
    - name: "Kỹ năng"
      text: "Rèn tư duy phản biện, tự học, giải quyết vấn đề, làm việc độc lập và hợp tác trong môi trường số."
      clips: [[0, 5], [6, 10]]
    - name: "Cập nhật"
      text: "Học tập suốt đời, thường xuyên cập nhật tiến bộ của khoa học công nghệ."
      clips: [[1, 12]]
    - name: "Trách nhiệm"
      text: "Dùng AI an toàn, hiệu quả, có trách nhiệm; tuân thủ đạo đức nghề nghiệp và bản quyền."
      clips: [[0, 12]]
  direction_goal: "Hoàn thiện năng lực chuyên môn, kỹ năng sư phạm và phẩm chất nghề nghiệp — trở thành người giáo viên âm nhạc năng động, sáng tạo, biết ứng dụng công nghệ hiện đại trong giảng dạy."

  portfolio_goal: "Portfolio này tổng hợp, lưu trữ và thể hiện quá trình học tập, rèn luyện cùng những kiến thức, kỹ năng mình đạt được trong học phần — từ hiểu biết về công nghệ số, AI đến cách dùng ChatGPT, Gemini và các nền tảng số để học tập và giải quyết vấn đề thực tiễn."
