        - kind: "Blog của công ty bán ứng dụng"
          year: 2026
          ref: "Singing Carrots (2026) Best app to learn singing 2026: 7 apps compared by learning style. Blog."
          url: "https://blog.singingcarrots.com/?p=4806"
          marks: [2, 1, 0, 0, 0]
