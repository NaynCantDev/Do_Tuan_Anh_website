# Bài 2 – ghi đè lên projects[id=2] trong data.yaml (render.py tự gộp).
# Tìm kiếm thực hiện ngày 14/11/2026 trên trình duyệt; mọi nguồn đã mở và đối chiếu.
objective: "Rèn kỹ năng tìm kiếm thông tin học thuật bằng toán tử nâng cao và đánh giá độ tin cậy của nguồn tin. Mình chọn một chủ đề gắn với sở thích ca hát và việc học Thanh nhạc: công nghệ phản hồi hình ảnh thời gian thực (real-time visual feedback – phần mềm hiện cao độ, phổ âm lên màn hình khi hát) có giúp người học hát chuẩn hơn không, và dạy thanh nhạc trong môi trường số đang gặp những thách thức gì. Kết quả là một danh sách 11 nguồn đã đánh giá theo bộ tiêu chí CRAAP, trong đó 9 nguồn được dùng, 1 nguồn chỉ dùng có điều kiện và 1 nguồn bị loại."
process:
  - "Bước 1: Đặt câu hỏi tìm kiếm và tách thành từ khóa song ngữ: phản hồi hình ảnh / real-time visual feedback, cao độ / pitch accuracy, thanh nhạc / singing, voice pedagogy, dạy học trực tuyến / virtual teaching. Giới hạn thời gian ưu tiên 2014–2026."
  - "Bước 2: Tìm trên 3 nơi: Semantic Scholar (cơ sở dữ liệu học thuật quốc tế), VJOL – Tạp chí Giáo dục Nghệ thuật của trường (tạp chí chuyên ngành trong nước), và thư mục sách/thư viện (Open Library) để xác minh sách chuyên khảo."
  - "Bước 3: Dùng toán tử: dấu ngoặc kép để tìm đúng cụm, AND/OR để ghép và mở rộng, bộ lọc năm thay cho before/after, và thu hẹp dần khi kết quả quá nhiều. Mỗi lượt tìm được chụp màn hình làm minh chứng."
  - "Bước 4: Mở từng nguồn, kiểm tra tác giả, nơi đăng, năm, phương pháp và số liệu; chấm theo 5 tiêu chí CRAAP (Currency – tính cập nhật, Relevance – liên quan, Authority – thẩm quyền, Accuracy – chính xác, Purpose – mục đích)."
  - "Bước 5: Ghi tài liệu tham khảo theo chuẩn Harvard và tổng hợp: các nguồn nói giống nhau ở đâu, mâu thuẫn ở đâu."
  - "Khó khăn: Google Scholar và Bing chặn trình duyệt, báo “lưu lượng bất thường” và đòi xác minh. – giải quyết bằng cách chuyển sang Semantic Scholar và ô tìm kiếm riêng của VJOL; với Google, mình ghi lại cú pháp toán tử để dùng khi có thể tìm bình thường."
  - "Khó khăn: Từ khóa “voice pedagogy” technology online teaching survey trả về khoảng 4.460 kết quả, phần lớn về dạy STEM, không phải thanh nhạc. – giải quyết bằng cách thay từ chung bằng cụm đặc thù trong ngoặc kép (“singing voice”, “virtual teaching”), còn đúng 2 kết quả và kết quả đầu là nghiên cứu cần tìm."
  - "Khó khăn: Hai blog về ứng dụng luyện hát nói ngược nhau về cùng một ứng dụng. – giải quyết bằng cách không dùng blog làm bằng chứng, chỉ dùng nghiên cứu có phương pháp rõ ràng."
tool: "Semantic Scholar, VJOL (Tạp chí Giáo dục Nghệ thuật), Open Library; thử Google Scholar và Bing nhưng bị chặn"
ai_use: "Không dùng AI để tìm hay đánh giá nguồn. Mọi nguồn được mở trực tiếp và đối chiếu thông tin xuất bản"
product:
  intro: "Yêu cầu: trình bày kết quả tìm kiếm học thuật bằng các toán tử nâng cao và bảng đánh giá nguồn tin đã thực hiện."
  blocks:
    - type: brief
      title: "Câu hỏi tìm kiếm"
      question: "Phản hồi hình ảnh thời gian thực có giúp người học hát chuẩn cao độ hơn không, và dạy thanh nhạc trong môi trường số đang gặp những thách thức gì?"
      facts:
        - ["Vì sao chọn", "Mình thích hát và đang học Thanh nhạc. Trang chủ portfolio cũng có một máy đo cao độ bằng micro, nên mình muốn biết loại công cụ này có cơ sở khoa học hay không."]
        - ["Từ khóa tiếng Việt", "thanh nhạc, công nghệ số, ứng dụng công nghệ thông tin, dạy học trực tuyến"]
        - ["Từ khóa tiếng Anh", "real-time visual feedback, singing, pitch accuracy, voice pedagogy, virtual teaching"]
        - ["Thời gian", "Ưu tiên 2014–2026; giữ lại vài nguồn cũ hơn nếu là nghiên cứu nền tảng"]
        - ["Ngày tìm", "14/11/2026"]

    - type: table
      title: "Toán tử đã dùng"
      head: ["Toán tử", "Tác dụng", "Truy vấn mình dùng"]
      rows:
        - ["\"…\" (ngoặc kép)", "Tìm đúng cả cụm, không tách từ", "\"real-time visual feedback\" singing \"pitch accuracy\""]
        - ["AND", "Bắt buộc có đủ các ý", "\"thanh nhạc\" AND \"công nghệ\""]
        - ["OR", "Chấp nhận một trong các từ đồng nghĩa", "(singing OR vocal) – dùng trong truy vấn mở rộng"]
        - ["Lọc năm (Date Range)", "Thay cho after:/before: của Google", "2014–2026 và 2020–2026 trên Semantic Scholar"]
        - ["Thu hẹp bằng cụm đặc thù", "Bớt kết quả lạc đề", "\"singing voice\" pedagogues \"virtual teaching\" COVID-19"]
        - ["site: và filetype:pdf", "Chỉ lấy tệp PDF trên một trang (dự định dùng với Google)", "\"thanh nhạc\" \"công nghệ số\" site:vjol.info.vn filetype:pdf – bị Bing chặn, thay bằng ô tìm kiếm của VJOL"]

    - type: searchlog
      title: "Nhật ký tìm kiếm"
      rounds:
        - db: "Google Scholar"
          query: "\"real-time visual feedback\" singing \"pitch accuracy\" · từ 2014"
          result: "Bị chặn"
          note: "Google trả về trang “We're sorry…”, nghi lưu lượng tự động. Mình không cố vượt qua mà chuyển sang cơ sở dữ liệu khác."
          shots: [{ file: "images/bai2/s0_blocked.jpg", caption: "Google Scholar chặn truy vấn" }]
        - db: "Semantic Scholar"
          query: "\"real-time visual feedback\" singing pitch accuracy · lọc 2014–2026"
          result: "311 kết quả"
          note: "Ngay trang đầu có 3 nguồn dùng được: Leong & Cheng (2014), luận văn của Zaki-Azat (2016) và bài tổng quan của Lã & Fiuza (2022)."
          shots: [{ file: "images/bai2/s1_semantic.jpg", caption: "Cụm trong ngoặc kép + lọc năm" }]
        - db: "VJOL – Tạp chí Giáo dục Nghệ thuật"
          query: "thanh nhạc công nghệ"
          result: "Có bài của chính trường"
          note: "Tìm thấy bài đánh giá việc ứng dụng CNTT trong giảng dạy thanh nhạc cho ngành Sư phạm Âm nhạc của Trường ĐHSP Nghệ thuật TW – đúng ngành của mình."
          shots: [{ file: "images/bai2/s2_vjol.jpg", caption: "Ô tìm kiếm riêng của tạp chí" }]
        - db: "Semantic Scholar"
          query: "\"voice pedagogy\" technology online teaching survey · 2020–2026"
          result: "≈ 4.460 kết quả – nhiễu"
          note: "Từ khóa quá chung: các kết quả đầu về dạy STEM và dạy toán, không phải thanh nhạc. Bài học: thêm từ không giúp thu hẹp nếu từ đó quá phổ biến."
          shots: [{ file: "images/bai2/s3_noise.jpg", caption: "Truy vấn quá rộng, kết quả lạc đề" }]
        - db: "Semantic Scholar"
          query: "\"singing voice\" pedagogues \"virtual teaching\" COVID-19 · 2020–2026"
          result: "2 kết quả – trúng đích"
          note: "Thay từ chung bằng hai cụm đặc thù trong ngoặc kép, còn đúng 2 kết quả. Kết quả đầu là khảo sát 387 giáo viên thanh nhạc trên Journal of Voice."
          shots: [{ file: "images/bai2/s4_refined.jpg", caption: "Sau khi thu hẹp: từ ~4.460 xuống 2" }]

    - type: sources
      title: "Bảng đánh giá nguồn tin"
      intro: "Mỗi nguồn được chấm theo 5 tiêu chí CRAAP: cập nhật, liên quan, thẩm quyền, chính xác, mục đích."
      crit: ["Cập nhật", "Liên quan", "Thẩm quyền", "Chính xác", "Mục đích"]
      items:
        - kind: "Bài báo · tạp chí trong nước"
          year: 2023
          ref: "Nguyễn Thị Thu Hằng (2023) 'Đánh giá hoạt động ứng dụng công nghệ thông tin trong giảng dạy thanh nhạc cho ngành Sư phạm Âm nhạc, Trường Đại học Sư phạm Nghệ thuật Trung ương', Tạp chí Giáo dục Nghệ thuật, số 45."
