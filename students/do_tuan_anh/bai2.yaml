          review: "Bài xếp chính sản phẩm của công ty đứng đầu: xung đột lợi ích. Bài này nói một ứng dụng đã ngừng hoạt động, trong khi một blog khác lại khuyên dùng chính ứng dụng đó. Không có phương pháp, không trích nguồn, nên mình loại."

    - type: analysis
      title: "Tổng hợp: các nguồn nói gì"
      items:
        - title: "Phản hồi hình ảnh có ích, nhất là với người mới"
          text: "Ba thực nghiệm (Wilson, 2006; Leong và Cheng, 2014; Berglin và cộng sự, 2022) đều thấy người học tiến bộ khi được nhìn cao độ hoặc âm sắc của mình trên màn hình. Hiệu quả rõ nhất ở người hát chưa chuẩn và ở giai điệu nhiều nốt."
        - title: "Nhưng không phải lúc nào cũng có tác dụng"
          text: "Zaki-Azat (2016) không thấy khác biệt. Wilson (2006) chỉ ra rằng màn hình quá nhiều thông tin làm người hát bị quá tải. Vì vậy giao diện nên đơn giản và chỉ là công cụ phụ trợ."
        - title: "Công nghệ hỗ trợ, không thay giáo viên"
          text: "Lã và Fiuza (2022), Nair (1999) và các tác giả trong nước cùng đề xuất kết hợp phản hồi hình ảnh với cách dạy truyền thống. Khảo sát của Murdaugh và cộng sự (2022) cho thấy dạy online chưa thay được buổi học trực tiếp."
        - title: "Ở Việt Nam, rào cản là hạ tầng và năng lực số"
          text: "Ba bài trong nước cùng nêu thiếu thiết bị, năng lực công nghệ không đều giữa giảng viên và sinh viên, cùng vấn đề bản quyền và dữ liệu (Nguyễn Thị Thu Hằng, 2023; Hoàng Quốc Tuấn, 2025; Hà Thị Lý và Nguyễn Thị Huyền, 2026)."
        - title: "Áp dụng cho bản thân"
          text: "Khi luyện hát ở nhà, mình có thể dùng một công cụ hiện cao độ đơn giản để tự kiểm tra những đoạn hay phô, ghi âm lại để nghe, nhưng vẫn cần giáo viên chỉnh kỹ thuật thở và âm sắc. Những thứ đó màn hình không thể hiện hết."
