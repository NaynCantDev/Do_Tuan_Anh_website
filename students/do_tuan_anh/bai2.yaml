          verdict: use
          review: "Viết đúng về ngành và trường của mình, đăng trên tạp chí của trường. Bài nặng về đánh giá thực trạng và đề xuất, ít số liệu đo lường nên mình dùng để hiểu bối cảnh, không dùng làm bằng chứng về hiệu quả."
        - kind: "Bài báo · tạp chí trong nước"
          year: 2025
          ref: "Hoàng Quốc Tuấn (2025) 'Giảng dạy thanh nhạc trong kỷ nguyên số: xu hướng mới', Tạp chí Khoa học Trường ĐHSP Hà Nội 2, số 04, tập 01, tr. 231–239."
          url: "https://sjsh.hpu2.edu.vn/index.php/journal/article/download/630/261/2309"
          marks: [2, 2, 2, 1, 2]
          verdict: use
          review: "Tác giả là giảng viên Trường ĐHSP Nghệ thuật TW; bài tổng hợp lợi ích, thách thức và hướng giảng dạy thanh nhạc trong môi trường số. Là bài luận tổng quan, không có thực nghiệm."
        - kind: "Bài báo · tạp chí trong nước"
          year: 2026
          ref: "Hà Thị Lý và Nguyễn Thị Huyền (2026) 'Ứng dụng công nghệ số trong đào tạo Thanh nhạc: xu hướng và thách thức', Tạp chí Giáo dục và Xã hội, tháng 1/2026 (kì 2), tr. 50–55."
          url: "https://giaoducvaxahoi.vn/pic/Service/ha_thi_ly_nguyen_thi_huyen_pages_50_55_2070.pdf"
          marks: [2, 2, 2, 1, 2]
          verdict: use
          review: "Mới nhất trong danh sách. Kết hợp nghiên cứu tài liệu với phỏng vấn sâu giảng viên và sinh viên Thanh nhạc; chỉ ra thách thức về hạ tầng, năng lực số và bản quyền. Phương pháp định tính nên không khái quát được bằng con số."
        - kind: "Bài báo · tạp chí quốc tế có bình duyệt"
          year: 2014
          ref: "Leong, S. and Cheng, L. (2014) 'Effects of real-time visual feedback on pre-service teachers' singing', Journal of Computer Assisted Learning, 30(3), pp. 285–296. doi:10.1111/jcal.12046."
          url: "https://doi.org/10.1111/jcal.12046"
          marks: [1, 2, 2, 2, 2]
          verdict: use
          review: "Rất gần với mình: 40 sinh viên sư phạm âm nhạc, chia nhóm thực nghiệm dùng phần mềm Sing & See trong 12 tuần và nhóm đối chứng; nhóm thực nghiệm cải thiện rõ về âm sắc. Mẫu nhỏ và là nghiên cứu thử nghiệm (pilot)."
        - kind: "Bài báo · tạp chí quốc tế có bình duyệt"
          year: 2022
          ref: "Berglin, J., Pfordresher, P.Q. and Demorest, S. (2022) 'The effect of visual and auditory feedback on adult poor-pitch remediation', Psychology of Music, 50(4), pp. 1077–1090. doi:10.1177/03057356211026730."
          url: "https://doi.org/10.1177/03057356211026730"
          marks: [2, 2, 2, 2, 2]
          verdict: use
          review: "Thiết kế chặt: kiểm tra trước–sau, chia ngẫu nhiên 3 nhóm. Chỉ nhóm có phản hồi hình ảnh tiến bộ có ý nghĩa, rõ nhất khi hát giai điệu 4 nốt. Đối tượng là người lớn hát lệch cao độ, nên chưa chắc đúng với người đã học hát."
        - kind: "Bài tổng quan · tạp chí quốc tế, truy cập mở"
          year: 2022
          ref: "Lã, F.M.B. and Fiuza, M.B. (2022) 'Real-time visual feedback in singing pedagogy: current trends and future directions', Applied Sciences, 12(21), 10781. doi:10.3390/app122110781."
          url: "https://www.mdpi.com/2076-3417/12/21/10781"
          marks: [2, 2, 2, 2, 2]
          verdict: use
          review: "Tổng quan các công cụ phản hồi hình ảnh cho hơi thở, thanh quản và cộng hưởng; danh mục tài liệu dày giúp mình tra ngược thêm nguồn gốc (Welch và cộng sự, 2005). Có công khai báo cáo bình duyệt."
        - kind: "Bài báo · tạp chí quốc tế có bình duyệt"
          year: 2022
          ref: "Murdaugh, K., Bainac Hausknecht, J. and Herbst, C.T. (2022) 'In-person or virtual? Assessing the impact of COVID-19 on the teaching habits of voice pedagogues', Journal of Voice, 36(5), pp. 735.e19–735.e25. doi:10.1016/j.jvoice.2020.08.027."
          url: "https://doi.org/10.1016/j.jvoice.2020.08.027"
          marks: [2, 2, 2, 2, 2]
          verdict: use
          review: "Khảo sát 387 giáo viên thanh nhạc toàn cầu: dạy online chỉ được hài lòng ở mức vừa phải, khó đánh giá những phẩm chất giọng hát thuần âm học. Trả lời trực tiếp nửa sau câu hỏi của mình."
        - kind: "Luận văn thạc sĩ · truy cập mở"
          year: 2006
          ref: "Wilson, P.H. (2006) Does real-time visual feedback improve pitch accuracy in singing? Luận văn thạc sĩ. The University of Sydney."
          url: "https://ses.library.usyd.edu.au/handle/2123/1526"
          marks: [0, 2, 1, 2, 2]
          verdict: use
          review: "Nguồn cũ nhưng là thực nghiệm có nhóm đối chứng, phân tích âm học từng bài hát. Phát hiện quan trọng: màn hình phức tạp làm tăng tải nhận thức, người đã học hát tiến bộ hơn với giao diện đơn giản. Luận văn chưa qua bình duyệt như bài báo."
        - kind: "Luận văn thạc sĩ · truy cập mở"
          year: 2016
          ref: "Zaki-Azat, J.N. (2016) The influence of real-time visual feedback training on vocal control. Luận văn thạc sĩ. Wilfrid Laurier University."
          url: "https://scholars.wlu.ca/etd/1812"
          marks: [1, 2, 1, 2, 2]
          verdict: use
          review: "Mình giữ nguồn này vì nó cho kết quả ngược lại: không thấy hiệu quả của phản hồi hình ảnh lên khả năng kiểm soát giọng. Có bằng chứng trái chiều giúp kết luận của mình không bị một chiều."
        - kind: "Sách chuyên khảo"
          year: 1999
          ref: "Nair, G. (1999) Voice – Tradition and Technology: A State-of-the-Art Studio. San Diego: Singular Publishing Group."
          url: "https://openlibrary.org/works/OL8528829W"
