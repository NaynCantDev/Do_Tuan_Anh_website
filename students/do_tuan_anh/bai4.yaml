# Bài 4 – ghi đè projects[id=4]. Phần 1: minh chứng họp nhóm thật (Zalo + Google Meet, 13/11/2026).
# Phần 2: dự án cá nhân quản lý bằng GitHub Issues + Milestone, so sánh 2 trợ lý AI.
objective: "Rèn kỹ năng dùng công cụ giao tiếp, hợp tác và quản lý dự án trực tuyến. Bài gồm hai phần. Phần 1 là phối hợp nhóm thật: Nhóm 1 (5 thành viên) dùng Zalo để phân công trước và họp trên Google Meet tối 13/11/2026 để thống nhất kế hoạch dự án “Ứng dụng AI trong dạy học Âm nhạc ở Trung học cơ sở”; mình phụ trách ổn định nhóm, kiểm tra đường truyền và giới thiệu mục tiêu cuộc họp. Phần 2 là một dự án nhỏ mình tự quản lý trên GitHub Issues: so sánh câu trả lời của các trợ lý AI cho 5 câu hỏi ngành Thanh nhạc, để luyện cách chia việc, đặt hạn, ghi tiến độ và ghi lại quyết định trên một công cụ công khai."
process:
  - "Bước 1 (nhóm): Trước buổi họp, phân công được gửi trong nhóm Zalo “Nhóm 1 CNS&AI” lúc 21:59: mỗi phần của cuộc họp có một người phụ trách, kèm chủ đề, nền tảng và mục tiêu cuộc họp."
  - "Bước 2 (nhóm): Họp trên Google Meet lúc 22:35 ngày 13/11/2026, đủ 5 thành viên. Mình mở đầu: ổn định nhóm, kiểm tra mic và đường truyền của các bạn, nêu mục tiêu buổi họp. Sau đó Phương Anh giới thiệu ý tưởng, cả nhóm góp ý chọn công cụ AI, Vân Anh tổng hợp và chia nhiệm vụ."
  - "Bước 3 (cá nhân): Chọn công cụ. Portfolio này đặt trên GitHub nên mình dùng luôn GitHub Issues làm bảng công việc: mỗi việc là một issue, nhãn (label) cho biết giai đoạn, cột mốc (milestone) gom các việc và hiện phần trăm hoàn thành, hạn chót 16/11/2026."
  - "Bước 4: Lập kế hoạch. Tạo 6 issue: lập bộ câu hỏi, chạy trên Gemini, chạy trên ChatGPT, chạy trên Copilot, đối chiếu và chấm điểm, viết báo cáo. Mỗi issue có danh sách việc nhỏ để đánh dấu."
  - "Bước 5: Thực hiện và ghi nhật ký. Mỗi khi xong một việc, mình bình luận kết quả, phát hiện và quyết định vào issue tương ứng rồi đóng issue. Mọi người có liên kết đều xem được tiến độ mà không cần đăng nhập."
  - "Bước 6: Chạy 5 câu hỏi thuộc 5 dạng (kiến thức chuyên môn, tra cứu sự kiện, sư phạm, nhạc lý, sáng tạo) trên Gemini và ChatGPT, mỗi câu một cuộc trò chuyện mới, chụp màn hình."
  - "Bước 7: Đối chiếu với tài liệu và chấm theo 5 tiêu chí, thang 1–5. Việc cuối được đóng tự động bằng commit có dòng “Closes #6” khi đưa báo cáo lên web."
  - "Khó khăn: Microsoft Copilot bắt đăng nhập; Perplexity chỉ cho hỏi 1 câu rồi chặn bằng màn hình đăng ký. – giải quyết bằng cách không tạo tài khoản mới chỉ để làm bài, ghi quyết định thu hẹp phạm vi còn 2 công cụ vào issue #4 rồi đóng issue với trạng thái “không thực hiện”. Đây cũng là một tình huống quản lý dự án thật: kế hoạch thay đổi thì phải ghi lại lý do."
  - "Khó khăn: Hỏi cùng một câu, AI có thể trả lời khác nhau. – giải quyết bằng cách hỏi lại câu 5 trên Gemini và ghi nhận sự khác biệt thay vì chỉ lấy lần trả lời “đẹp” nhất."
tool: "Zalo (phân công, nhắn tin nhóm); Google Meet (họp trực tuyến); GitHub Issues, Labels, Milestone (quản lý dự án cá nhân); Gemini, ChatGPT (đối tượng so sánh)"
ai_use: "Gemini và ChatGPT là đối tượng được so sánh. Việc lập kế hoạch, đối chiếu, chấm điểm do mình thực hiện"
product:
  intro: "Yêu cầu: trình bày minh chứng về việc sử dụng công cụ quản lý dự án và cách thức phối hợp trực tuyến."
