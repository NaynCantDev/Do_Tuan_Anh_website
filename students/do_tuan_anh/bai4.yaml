        - ["Google Meet (nhóm)", "Họp trực tuyến cả 5 người", "Buổi họp 22:35 ngày 13/11/2026, mình mở đầu và kiểm tra đường truyền"]
        - ["Issue", "Giao việc: mỗi việc một thẻ, có danh sách việc nhỏ", "6 issue, từ lập kế hoạch đến viết báo cáo"]
